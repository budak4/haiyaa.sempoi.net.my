<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Problematic Bilik 🏆</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #1a0523;
            font-family: 'Press Start 2P', cursive;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #2b0938;
            padding: 20px 15px;
            border: 4px solid #ff007f;
            box-shadow: 6px 6px 0px #00ffff;
            border-radius: 4px;
        }

        h1 {
            color: #ffcc00;
            text-shadow: 3px 3px #ff007f;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Container Senarai Carta */
        .chart-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        /* Kad Item Rank */
        .chart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #4a154b;
            border: 2px solid #00ffcc;
            padding: 10px 12px;
            font-size: 0.6rem;
            box-shadow: 3px 3px 0px #000;
        }

        /* Top 1 Special Styling (King of Problem) */
        .chart-item.top-1 {
            background: #ff007f;
            border-color: #ffcc00;
            color: #ffffff;
            animation: pulse 1.5s infinite;
        }

        .rank-num {
            font-size: 0.75rem;
            color: #ffcc00;
            width: 30px;
            text-align: left;
        }

        .top-1 .rank-num {
            color: #ffffff;
        }

        .member-name {
            flex-grow: 1;
            text-align: left;
            padding-left: 10px;
        }

        .badge {
            font-size: 0.5rem;
            background: #1a0523;
            color: #00ffcc;
            padding: 4px 6px;
            border: 1px solid #00ffcc;
        }

        .top-1 .badge {
            background: #ffcc00;
            color: #000;
            border-color: #000;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 CARTA PROBLEMATIC BILIK 👑</h1>
    <p style="font-size: 0.5rem; color: #00ffcc; line-height: 1.4;">
        KEPUTUSAN RASMI BERDASARKAN UNDIAN AHLI BILIK:
    </p>

    <div class="chart-list">
        <!-- RANK 1: KING OF PROBLEM -->
        <div class="chart-item top-1">
            <span class="rank-num">#1</span>
            <span class="member-name">Iqbal</span>
            <span class="badge">KING OF PROBLEMATIC 👑</span>
        </div>

        <!-- RANK 2 -->
        <div class="chart-item">
            <span class="rank-num">#2</span>
            <span class="member-name">Ammar</span>
            <span class="badge">SUSPEK TEGAR 🚨</span>
        </div>

        <!-- RANK 3 -->
        <div class="chart-item">
            <span class="rank-num">#3</span>
            <span class="member-name">Alip</span>
            <span class="badge">PENGENDALAM REMBAT 🧹</span>
        </div>

        <!-- RANK 4 -->
        <div class="chart-item">
            <span class="rank-num">#4</span>
            <span class="member-name">Awal</span>
            <span class="badge">DIAM-DIAM UAT 🐛</span>
        </div>

        <!-- RANK 5 -->
        <div class="chart-item">
            <span class="rank-num">#5</span>
            <span class="member-name">Amir</span>
            <span class="badge">MANGSA KEADAAN 😇</span>
        </div>

        <!-- RANK 6 -->
        <div class="chart-item">
            <span class="rank-num">#6</span>
            <span class="member-name">Aqil</span>
            <span class="badge">PENENANG BILIK 🕊️</span>
        </div>

        <!-- RANK 7: PALING INNOCENT -->
        <div class="chart-item" style="border-color: #ffcc00;">
            <span class="rank-num">#7</span>
            <span class="member-name">Mika</span>
            <span class="badge">BUDAK SYURGA 👼</span>
        </div>
    </div>
</div>

</body>
</html>
